# XcodeGen spec for the Tickr iOS app. The generated Tickr.xcodeproj IS committed so the
# app opens in Xcode as is; after editing this file run `xcodegen` and commit the result (CI fails
# when the two differ). Sources are a synchronized folder, so adding a Swift file under Tickr/
# needs no project change.
name: Tickr
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # The Xcode release the owner uses. It becomes LastUpgradeCheck, so Xcode does not offer to
  # "update to recommended settings"; never accept such an offer in Xcode: put the setting here.
  xcodeVersion: "27.2"
  # XcodeGen rewrites the whole Tickr.xcodeproj and drops any scheme it does not generate;
  # put back the hand-kept shared scheme (see the note at the end of this file).
  postGenCommand: git checkout -- "Tickr.xcodeproj/xcshareddata/xcschemes"
attributes:
  LastSwiftUpdateCheck: "2720"
packages:
  TickrShared:
    path: ../shared
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Settings Xcode recommends for current projects.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  Tickr:
    type: application
    platform: iOS
    sources:
      - path: Tickr
        type: syncedFolder
    dependencies:
      - package: TickrShared
        product: TickrKit
      - package: TickrShared
        product: TickrDesign
      # The Live Activity's widget extension, embedded in the app.
      - target: TickrWidgets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Tickr
        # Languages the String Catalogs translate (app and shared package); the app follows the
        # system language (docs/design-system.md). check_swift_rules.py keeps it complete.
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Launch screen: the window background with the mark (Assets.xcassets, made by
        # apps/scripts/make_brand_assets.py), so the first screen follows without a flash.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: Confirms commands that cancel orders or close positions.
        # The bot starts, updates and ends the trading day's Live Activity by push (TickrWidgets).
        NSSupportsLiveActivities: true
        # The API address the app starts with before pairing: the Simulator's or the iPhone's,
        # set per destination in Config/Signing.xcconfig.
        TickrAPIAddress: $(TICKR_API_ADDRESS)
        # The Simulator's own token file on this Mac, read by a Simulator build at launch.
        TickrSimulatorTokenFile: $(TICKR_SIMULATOR_FILE)
        # tickr://pair?... links from `python -m tickr.api pair` open the app to pair.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).pair
            CFBundleURLSchemes: [tickr]
        # The APNs environment of this build's push token (TICKR_APS_ENVIRONMENT in
        # apps/Config/Identity.xcconfig: development for Debug, production for Release), which the
        # app tells the bot (TickrKit PushIdentity).
        TickrApsEnvironment: $(TICKR_APS_ENVIRONMENT)
        # Plain HTTP is allowed only to local addresses (the Simulator reaches the Mac's API on
        # 127.0.0.1). Remote access goes through HTTPS (Tailscale serve).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Push (APNs) for the bot's alerts and Live Activity. aps-environment stays development:
    # exporting an archive for TestFlight or the App Store sets production from the distribution
    # profile. Time-sensitive: the bot's critical alerts break through Focus.
    entitlements:
      path: Support/Tickr.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    # The bundle id prefix, the team id and the API address come from Config/Signing.xcconfig
    # (which includes apps/Config/Identity.xcconfig) and the git-ignored Config/Local.xcconfig.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TICKR_BUNDLE_ID_PREFIX).ios
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_PREVIEWS: YES
  # The trading day's Live Activity (Lock Screen and Dynamic Island, mockup v138), drawn from the
  # content-state the bot pushes (TickrKit TickrActivityAttributes). Its own texts and String
  # Catalog (Widgets/Sources/L10n.swift); the versions are the app's (project settings above).
  TickrWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets/Sources
        type: syncedFolder
    dependencies:
      - package: TickrShared
        product: TickrKit
      - package: TickrShared
        product: TickrDesign
    info:
      path: Widgets/Support/Info.plist
      properties:
        CFBundleDisplayName: Tickr
        # The extension's String Catalog and the shared package's (check_swift_rules.py).
        CFBundleLocalizations: [en, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    # The bundle id prefix (apps/Config/Identity.xcconfig, through Config/Signing.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TICKR_BUNDLE_ID_PREFIX).ios.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_PREVIEWS: YES
        # Archived inside the app only, so an archive stays an iOS app for TestFlight.
        SKIP_INSTALL: YES
  # Swift Testing tests of the screens' logic (Tests/TickrTests), hosted in the app so they can
  # reach its internal types with @testable import.
  TickrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TickrTests
    dependencies:
      - target: Tickr
    # The bundle id prefix (apps/Config/Identity.xcconfig, through Config/Signing.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TICKR_BUNDLE_ID_PREFIX).ios.tests
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  # Walks every screen against a running bot API and keeps screenshots (Tests/TickrUITests).
  TickrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TickrUITests
    dependencies:
      - target: Tickr
    # The bundle id prefix (apps/Config/Identity.xcconfig, through Config/Signing.xcconfig).
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TICKR_BUNDLE_ID_PREFIX).ios.uitests
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tickr
# No schemes here: the shared scheme "Tickr iOS" (named for the platform so it stays distinct
# from "Tickr macOS" in the root Tickr.xcworkspace) is kept by hand in Xcode's own format in
# Tickr.xcodeproj/xcshareddata/xcschemes, so building in Xcode leaves the tree clean.
# postGenCommand above restores it after every `xcodegen generate`; change it in Xcode and commit.

# The screen tour and the unit tests have their own generated schemes, so "Tickr iOS" stays as
# kept by hand.
schemes:
  Tickr iOS Tests:
    build:
      targets:
        Tickr: all
        TickrTests: [test]
    test:
      config: Debug
      targets:
        - TickrTests
  Tickr iOS Screen Tour:
    build:
      targets:
        Tickr: all
        TickrUITests: [test]
    test:
      config: Debug
      targets:
        - TickrUITests
