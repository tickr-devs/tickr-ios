name: layout-sweep
# Every screen of both apps at several sizes, in English and Spanish (macOS: window sizes and a
# resize drag that fails on a layout loop; iOS: three iPhones and three Dynamic Type sizes). Both
# jobs fail on a truncated text in any picture (apps/scripts/find_truncated_text.swift; the code
# rule `truncation` of check_swift_rules.py keeps the cutting modifiers out on every PR). Costly
# on macOS runners, so it runs only when asked: the `layout-sweep` label on a pull request, a
# manual run, or weekly on main, at night (Monday 08:47 UTC, before the US working day, so its four
# macOS jobs do not take the account's five macOS slots from pull requests). A failure on main
# opens an issue (ci-alert.yml). The pictures are kept as the run's artifacts.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: "47 8 * * 1"
# A new push to a pull request cancels its earlier run; runs on main are never cancelled.
concurrency:
  group: layout-sweep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The workflow only reads the repository: its token can change nothing.
permissions:
  contents: read
jobs:
  # Every screen at several window sizes, Chart inspector closed and open, in English and Spanish
  # (apps/macos/scripts/layout-sweep.sh). Fails when a resize crashes or hangs the app or a
  # picture shows a truncated text; the pictures are kept as the run's artifact for checking
  # overlaps.
  macos-layout-sweep:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'layout-sweep')
    # The Xcode 27 image: the one Xcode of every app job (apps/scripts/select-xcode.sh); macos-latest has Xcode 26.x only.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: apps/scripts/select-xcode.sh
      - name: Toolchain id for the build cache
        run: echo "XCODE_ID=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
      # Restore only: main's macos-app runs save the cache (debug builds with the tests). This job
      # builds less (the app product alone), so saving from here under the same key would replace
      # the cache pull requests restore with a poorer one.
      - name: Restore SwiftPM builds
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**', 'apps/macos/Launch/**') }}
          restore-keys: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-
      - name: Layout sweep
        run: apps/macos/scripts/layout-sweep.sh "$RUNNER_TEMP/layout-sweep"
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-layout-sweep
          path: ${{ runner.temp }}/layout-sweep
          if-no-files-found: ignore
  # Every tab, scrolled through, in English and Spanish at three Dynamic Type sizes, on the
  # smallest, a standard and the largest iPhone, against `tickr demo`
  # (apps/ios/Tests/TickrUITests/LayoutSweepUITests.swift). The pictures are kept as the run's artifact.
  ios-layout-sweep:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'layout-sweep')
    # The same image and Xcode as every other app job (apps/scripts/select-xcode.sh).
    runs-on: xcode-27
    timeout-minutes: 45
    # One iPhone per runner: three simulators on one 3-core runner starved its disk and left the
    # test runner waiting to load or launch (spindumps of run 43708324907).
    strategy:
      fail-fast: false
      matrix:
        iphone:
          - { name: smallest, pattern: "iPhone (SE|1\\de)" }
          - { name: standard, pattern: "^iPhone \\d+$" }
          - { name: largest, pattern: "Pro Max" }
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: apps/scripts/select-xcode.sh
      # uv installs exactly what uv.lock pins. Action pinned by commit: it has no major tag.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
      - name: Install the bot
        run: uv sync --frozen
      # A fresh runner has no demo fixture (it is never committed; docs/demo.md): build it here,
      # as its own step, so the start below only copies it and serves within seconds.
      - name: Build the demo fixture
        run: uv run --no-sync tickr demo --build-fixture
      - name: Start the demo bot API (port 8776, bot.toml [api] demo_port)
        run: |
          uv run --no-sync tickr demo > "$RUNNER_TEMP/demo.log" 2>&1 &
          for _ in $(seq 60); do
            curl -sf http://127.0.0.1:8776/status > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/demo.log"
          exit 1
      - name: Pick the iPhone (${{ matrix.iphone.name }})
        env:
          IPHONE_PATTERN: ${{ matrix.iphone.pattern }}
        run: |
          # By simulator id, so xcodebuild finds exactly that device: the first simulator whose name
          # fits, on the newest iOS that has one. Not "the newest runtime" alone: Xcode also ships
          # runtimes for one device (2026-11-18: `iOS-27-2-iPhone19-4` sorted as the newest, held no
          # "iPhone <number>", the list came back empty and xcodebuild fell back to "My Mac").
          # No fitting simulator anywhere fails this step with the names it saw.
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os, re, subprocess, sys
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          pattern = os.environ["IPHONE_PATTERN"]
          def ios_version(runtime):
              found = re.search(r"\.iOS-(\d+(?:-\d+)*)", runtime)
              return [int(x) for x in found.group(1).split("-")] if found else None
          runtimes = sorted((r for r in data["devices"] if ios_version(r)), key=ios_version, reverse=True)
          chosen = next(((r, d) for r in runtimes for d in data["devices"][r]
                         if re.search(pattern, d["name"])), None)
          if chosen is None:
              seen = {r: [d["name"] for d in data["devices"][r]] for r in runtimes}
              sys.exit(f"no simulator fits {pattern!r}; available: {seen}")
          runtime, device = chosen
          print(f"SWEEP_DEVICES={device['udid']}")
          print("picked:", runtime, device["name"], file=sys.stderr)
          PY
      - name: Layout sweep
        working-directory: apps/ios
        env:
          TEST_RUNNER_SWEEP_API: http://127.0.0.1:8776
        run: |
          args=()
          for id in $SWEEP_DEVICES; do args+=("-destination" "id=$id"); done
          xcodebuild test -project Tickr.xcodeproj -scheme "Tickr iOS Screen Tour" \
            "${args[@]}" -only-testing:TickrUITests/LayoutSweepUITests \
            -resultBundlePath "$RUNNER_TEMP/sweep.xcresult" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/sweep.log" 2>&1 || { grep -E "error:|failed|Fail" "$RUNNER_TEMP/sweep.log" | tail -n 60; exit 1; }
          tail -n 5 "$RUNNER_TEMP/sweep.log"
      - name: Export the pictures
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/sweep.xcresult" ] || exit 0
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sweep.xcresult" \
            --output-path "$RUNNER_TEMP/ios-layout-sweep"
      # No text may be cut (owner rule 2026-11-16): the sweep's own pictures (named
      # <language>-<text size>-tab<n>[-scroll<k>]), read for an ellipsis.
      - name: Find truncated text
        run: |
          python3 - "$RUNNER_TEMP/ios-layout-sweep" "$RUNNER_TEMP/ios-sweep-pictures" <<'PY'
          import json, os, shutil, sys
          exported, pictures = sys.argv[1], sys.argv[2]
          os.makedirs(pictures, exist_ok=True)
          for test in json.load(open(os.path.join(exported, "manifest.json"))):
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "")
                  if name.startswith(("en-", "es-")):
                      shutil.copy(os.path.join(exported, attachment["exportedFileName"]),
                                  os.path.join(pictures, name.split("_0_")[0] + ".png"))
          PY
          swift apps/scripts/find_truncated_text.swift "$RUNNER_TEMP/ios-sweep-pictures"
      - name: Keep the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-layout-sweep-${{ matrix.iphone.name }}
          path: ${{ runner.temp }}/ios-layout-sweep
          if-no-files-found: ignore
