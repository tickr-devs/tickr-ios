name: ios-app
on:
  pull_request:
    # ready_for_review: a draft skips this job; marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/ios/**"
      - "apps/shared/**"
      - ".github/workflows/ios-app.yml"
      - "Aperture.xcworkspace/**"
  workflow_dispatch:
  # Weekly build of main, so a conflict between two separately green pull requests shows up.
  schedule:
    - cron: "0 12 * * 1"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones.
concurrency:
  group: ios-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Drafts skip the macOS runner (the bottleneck); run it on a draft through workflow_dispatch.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      # Build with the newest stable Xcode on the runner (the owner uses the current release).
      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -n 1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      # Pinned: a new XcodeGen release could change the output and fail the check below.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The committed Aperture.xcodeproj must be exactly what project.yml generates. git status
      # also catches files the generator deleted or added (a staged diff would hide deletions).
      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen generate
          changes=$(git status --porcelain --untracked-files=all -- .)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- .
            echo "::error::Aperture.xcodeproj differs from project.yml: run xcodegen in apps/ios and commit"
            exit 1
          fi
          test -f "Aperture.xcodeproj/xcshareddata/xcschemes/Aperture iOS.xcscheme"
      # Built through the root workspace, which is what the owner opens in Xcode.
      - name: Build for the iOS Simulator (unsigned)
        run: |
          if ! xcodebuild build \
              -workspace ../../Aperture.xcworkspace \
              -scheme 'Aperture iOS' \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            grep -E "error:" build.log || tail -n 80 build.log
            exit 1
          fi
          grep -E "warning:" build.log | grep -v "/SourcePackages/" || true
          tail -n 3 build.log
