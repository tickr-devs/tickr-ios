name: swift-rules
# The apps' Swift code rules (CLAUDE.md, "Swift code rules"): no words in code outside L10n.swift,
# no magic numbers, 2-space indentation, Spanish translation for every key, and SwiftLint. Also the
# check for git conflict markers in any tracked file. Runs on every pull request, whatever it
# touches, so it can be a required check.
on:
  pull_request:
  # The merge queue: the required checks run again on the queued change on top of the newest main
  # (and of the changes queued ahead of it), so two separately green pull requests cannot break main.
  merge_group:
  push:
    branches: [main]
# A new push to a pull request cancels its earlier run; runs on main are never cancelled.
concurrency:
  group: swift-rules-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The workflow only reads the repository: its token can change nothing.
permissions:
  contents: read
jobs:
  swift-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Here, not in the Python tests: this job runs on every pull request, docs-only ones too.
      - name: No git conflict markers in tracked files
        run: python3 .github/scripts/check_conflict_markers.py
      - name: Swift code rules (apps/scripts/check_swift_rules.py)
        run: python3 apps/scripts/check_swift_rules.py
      # SwiftLint's own Linux image, pinned so a new release can't fail an unrelated pull request.
      # No --config: the root .swiftlint.yml is found from here, and each app's own .swiftlint.yml
      # is merged for its files.
      - name: SwiftLint (.swiftlint.yml)
        run: >-
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.0
          swiftlint lint --strict --quiet
