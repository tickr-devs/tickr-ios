name: macos-app
on:
  pull_request:
    # ready_for_review: a draft skips this job; marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "tests/api/fixtures/**"
      - "src/tickr/api/schema/**"
      - "Tickr.xcworkspace/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:
  # Weekly build of main, so a conflict between two separately green pull requests shows up.
  schedule:
    - cron: "0 12 * * 1"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    # Drafts skip the macOS runner (the bottleneck); run it on a draft through workflow_dispatch.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The owner builds with the newest Xcode; use the newest release (not beta or RC) this runner has.
      - name: Select the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      # SwiftLint runs in the swift-rules workflow (Linux), on every pull request.
      - name: Design-system checks (docs/design-system.md)
        run: python3 apps/scripts/check_swift_rules.py
      - run: swift --version
      - name: Toolchain id for the build cache
        run: echo "XCODE_ID=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
      # SwiftPM build folders, so unchanged modules are not compiled again.
      # Key prefix v2: caches from before the repo rename hold absolute .../Aperture paths that break
      # the module cache under .../Tickr.
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**') }}
          restore-keys: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-
      - name: Shared package (contract models, design) tests
        working-directory: apps/shared
        run: swift test
      - name: macOS app build and screen-logic tests
        working-directory: apps/macos
        run: |
          swift build
          swift test
          scripts/make-app.sh
      # Builds the app as the owner does in Xcode and runs its UI tests (apps/macos/TickrUITests)
      # against the contract fixtures; ad-hoc signed, because a UI test runner must be signed.
      - name: Xcode workspace builds the macOS app and runs its UI tests
        run: |
          xcodebuild -version
          xcodebuild -workspace Tickr.xcworkspace -scheme "Tickr macOS" \
            -destination "platform=macOS" -derivedDataPath apps/macos/build/xcode \
            CODE_SIGN_IDENTITY=- test
