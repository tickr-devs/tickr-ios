name: macos-app
on:
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "tests/api/fixtures/**"
      - "src/aperture/api/schema/**"
      - "Aperture.xcworkspace/**"
      - ".github/workflows/macos-app.yml"
      - ".swiftlint.yml"
  workflow_dispatch:
  # Weekly build of main, so a conflict between two separately green pull requests shows up.
  schedule:
    - cron: "0 12 * * 1"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The owner builds with the newest Xcode; use the newest release (not beta or RC) this runner has.
      - name: Select the newest installed Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -viE "beta|rc" | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
      - name: Design-system checks (docs/design-system.md)
        run: |
          python3 apps/scripts/check_swift_rules.py
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint version
          swiftlint lint --strict --quiet --config .swiftlint.yml
      - run: swift --version
      - name: Toolchain id for the build cache
        run: echo "XCODE_ID=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
      # SwiftPM build folders, so unchanged modules are not compiled again.
      - name: Cache SwiftPM builds
        uses: actions/cache@v4
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Aperture/**') }}
          restore-keys: spm-${{ runner.os }}-${{ env.XCODE_ID }}-
      - name: Shared package (contract models, design) tests
        working-directory: apps/shared
        run: swift test
      - name: macOS app build
        working-directory: apps/macos
        run: |
          swift build
          scripts/make-app.sh
      - name: Xcode workspace builds the macOS app (what the owner opens in Xcode)
        run: |
          xcodebuild -version
          xcodebuild -workspace Aperture.xcworkspace -scheme "Aperture macOS" \
            -destination "platform=macOS" -derivedDataPath apps/macos/build/xcode \
            CODE_SIGNING_ALLOWED=NO build
