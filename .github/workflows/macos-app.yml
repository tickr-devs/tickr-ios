name: macos-app
on:
  pull_request:
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "tests/api/fixtures/**"
      - "src/aperture/api/schema/**"
      - "Aperture.xcworkspace/**"
      - ".github/workflows/macos-app.yml"
  push:
    branches: [main]
    paths:
      - "apps/macos/**"
      - "apps/shared/**"
      - "tests/api/fixtures/**"
      - "src/aperture/api/schema/**"
      - "Aperture.xcworkspace/**"
      - ".github/workflows/macos-app.yml"
jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Shared package (contract models, design) tests
        working-directory: apps/shared
        run: swift test
      - name: macOS app build
        working-directory: apps/macos
        run: |
          swift build
          scripts/make-app.sh
      - name: Xcode workspace builds the macOS app (what the owner opens in Xcode)
        run: |
          xcodebuild -version
          xcodebuild -workspace Aperture.xcworkspace -scheme "Aperture macOS" \
            -destination "platform=macOS" -derivedDataPath apps/macos/build/xcode \
            CODE_SIGNING_ALLOWED=NO build
