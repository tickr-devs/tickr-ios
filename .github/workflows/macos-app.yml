name: macos-app
on:
  pull_request:
    # ready_for_review: a draft skips this job; marking it ready runs it.
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue: the required checks run again on the queued change on top of the newest main
  # (and of the changes queued ahead of it), so two separately green pull requests cannot break main.
  merge_group:
  # Every merge to main that touches the app: a conflict between two separately green pull requests
  # shows up at once, and the SwiftPM cache that pull requests restore is saved from the newest main.
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly build of main (07:17 UTC, outside US market hours; not on the hour, when GitHub is
  # busiest and may drop scheduled runs): the release app bundle is checked too. The UI tests run
  # nightly in ui-tests.yml. A failure on main opens an issue (ci-alert.yml).
  schedule:
    - cron: "17 7 * * *"
# One run per pull request: a new push cancels the run still going for the previous one. macOS
# runner minutes cost ten times Linux ones. Runs on main are never cancelled: they share one group,
# so one runs at a time and, of those waiting behind it, GitHub keeps only the newest.
concurrency:
  group: macos-app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The workflow only reads the repository: its token can change nothing.
permissions:
  contents: read
jobs:
  macos-changes:
    # Says whether this pull request touches the macOS app. A workflow skipped by a `paths`
    # filter never reports its checks, and `macos-build-and-test` is a required check of main, so the filter
    # lives here: the job below is skipped (which satisfies the requirement) instead of missing.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          # A pull request: what it changes against its base. A push to main: what that push
          # changed. The merge queue: what this entry adds to the one queued ahead of it (or to
          # main), whose own run covers the rest. Nightly and manual runs always build.
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) range="$BEFORE..$AFTER" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            *) echo "app=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Its own command, so a failing diff stops the job instead of reading as "no changes".
          files=$(git diff --name-only --no-renames "$range")
          hits=$(printf '%s\n' "$files" | grep -E \
            '^(apps/macos/|apps/shared/|tests/api/fixtures/|src/tickr/api/schema/|apps/scripts/select-xcode\.sh$|apps/scripts/find_truncated_text\.swift$|Tickr\.xcworkspace/|\.github/workflows/macos-app\.yml$)' \
            || true)
          if [ -n "$hits" ]; then echo "app=true"; else echo "app=false"; fi >> "$GITHUB_OUTPUT"
  macos-build-and-test:
    # Drafts skip the macOS runner (the bottleneck); run it on a draft through workflow_dispatch.
    needs: macos-changes
    # Runs when the app changed, and also when `macos-changes` failed, so a broken diff never skips
    # the build into a pass. Skipped (reported as passing) for other pull requests.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (needs.macos-changes.result != 'success' || needs.macos-changes.outputs.app == 'true') }}
    # The Xcode 27 image: the one Xcode every app job builds with is the owner's Xcode 27
    # (apps/scripts/select-xcode.sh); macos-latest (macOS 26) has Xcode 26.x only. The iOS app
    # builds on the same image with the same Xcode.
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The one Xcode both apps build with; the version is written in the script only.
      - name: Select Xcode
        run: apps/scripts/select-xcode.sh
      # The Swift code rules and SwiftLint run in the swift-rules workflow (Linux), on every pull request.
      - run: swift --version
      - name: Toolchain id for the build cache
        run: echo "XCODE_ID=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_ENV"
      # SwiftPM build folders (with the fetched Factory checkout), so unchanged modules are not
      # compiled again. Saved only from main (every merge that touches the app and the nightly run,
      # below); pull requests restore the newest one and never save, because a pull request's cache
      # is visible to that pull request alone and ~300 MB per branch evicts main's from the 10 GB
      # repository limit.
      # Key prefix v2: caches from before the repo rename hold absolute .../Aperture paths that break
      # the module cache under .../Tickr.
      - name: Restore SwiftPM builds
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**', 'apps/macos/Launch/**') }}
          restore-keys: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-
      - name: Shared package (contract models, design) tests
        working-directory: apps/shared
        run: swift test
      # The truncation check's rules on recognized lines (which ellipses are a catalog text's own),
      # so a change to them cannot excuse a cut text unnoticed (ui-tests.yml reads the pictures).
      - name: Truncation check rules
        run: swift apps/scripts/find_truncated_text.swift --self-test
      # `swift test` builds the app's modules too, so no separate `swift build`.
      - name: macOS app screen-logic tests
        working-directory: apps/macos
        run: |
          swift test
          scripts/check-deployment-target.sh
      # A test run that hangs until the job's time limit cancels it (#853, 2026-11-27: 41 Swift
      # tests started and never finished): the stacks of the test processes still alive, so the
      # hang names the threads it waits on instead of only the tests that never ended. Runs only
      # on a cancel; `sample` (3 s per process) prints call stacks, never the process environment.
      - name: Stacks of a hung test run
        if: cancelled()
        run: |
          for pid in $(pgrep -f 'swiftpm-testing-helper|xctest' || true); do
            echo "::group::sample $pid"
            sample "$pid" 3 2>&1
            echo "::endgroup::"
          done
      # Before the release build below, so the cache holds the debug builds pull requests reuse.
      - name: Save SwiftPM builds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/shared/.build
            apps/macos/.build
          key: spm-v2-${{ runner.os }}-${{ env.XCODE_ID }}-${{ hashFiles('apps/shared/Package.swift', 'apps/macos/Package.swift', 'apps/shared/Sources/**', 'apps/macos/Tickr/**', 'apps/macos/Launch/**') }}
      # The release bundle (scripts/make-app.sh, ~2 min) is checked nightly on main and on manual
      # runs, not on every push.
      - name: Release app bundle carries its icon
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: apps/macos
        run: |
          scripts/make-app.sh
          scripts/check-app-bundle.sh build/Tickr.app
      # Builds the app and its UI test runner as the owner does in Xcode, without running them: the
      # UI tests (~8 min) run in ui-tests.yml on the `ui-tests` label and nightly on main.
      - name: Xcode workspace builds the macOS app and its UI tests
        run: |
          # The build's own exit status, not tee's, decides the step.
          set -o pipefail
          xcodebuild -version
          xcodebuild -workspace Tickr.xcworkspace -scheme "Tickr macOS" \
            -destination "platform=macOS" -derivedDataPath apps/macos/build/xcode \
            CODE_SIGN_IDENTITY=- build-for-testing 2>&1 | tee "$RUNNER_TEMP/xcode-macos.log"
          # Our own Swift warnings fail the job: the owner's Xcode stops on them (own-warnings.sh).
          apps/scripts/own-warnings.sh "$RUNNER_TEMP/xcode-macos.log"
